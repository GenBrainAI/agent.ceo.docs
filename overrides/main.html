{% extends "base.html" %}

{% block extrahead %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
{% endblock %}

{% block header %}
  {{ super() }}
  <div class="terminal-header-brand">
    <div class="terminal-header-brand__inner">
      <span class="terminal-header-brand__prompt">&gt;_</span>
      <span class="terminal-header-brand__title">AGENT_CEO</span>
      <span class="terminal-header-brand__tagline">// CYBORGENIC ORCHESTRATION PLATFORM</span>
    </div>
  </div>
{% endblock %}

{% block content %}
  {{ super() }}

  <!-- Scanline overlay — purely decorative, passes all pointer events through -->
  <div class="terminal-scanline-overlay" aria-hidden="true"></div>

  <style>
    /* Scanline overlay */
    .terminal-scanline-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
    }

    /* Header branding bar */
    .terminal-header-brand {
      background: #060f16;
      border-bottom: 1px solid #00ff4120;
      padding: 0.5rem 1.25rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .terminal-header-brand__inner {
      max-width: 75rem;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .terminal-header-brand__prompt {
      color: #00ff41;
      font-size: 1.4rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .terminal-header-brand__title {
      color: #00ff41;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-shadow: 0 0 8px rgba(0, 255, 65, 0.4);
    }

    .terminal-header-brand__tagline {
      color: #4a9a5c;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      .terminal-header-brand__tagline {
        display: none;
      }

      .terminal-header-brand__title {
        font-size: 1.1rem;
      }
    }
  </style>
{% endblock %}

{% block scripts %}
  {{ super() }}
{% endblock %}
