plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
      toc_depth: 3

extra_css:
  - stylesheets/terminalism.css

extra_javascript:
  - javascripts/terminal.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GenBrainAI
  generator: false
